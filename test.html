<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sponsor Carousel Test</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 2rem;
    color: #222;
  }

  .section {
    max-width: 800px;
    margin: 0 auto;
  }

  .carousel {
    position: relative;
    width: 100%;
    max-width: 700px;
    height: 260px;
    margin: 0 auto;
  }

  .carousel-track {
    position: relative;
    width: 100%;
    height: 220px;
  }

  .carousel-item {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 160px;
    background-color: #000;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: all 0.5s ease;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    opacity: 0;
    filter: brightness(0.6);
    z-index: 1;
  }

  .carousel-item img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    border-radius: 10px;
  }

  /* Center image */
  .carousel-item.active {
    opacity: 1;
    filter: brightness(1);
    width: 280px;
    height: 220px;
    z-index: 3;
    transform: translate(-50%, -50%) scale(1);
  }

  .carousel-item.prev {
    left: 35%;
    opacity: 0.6;
    filter: brightness(0.6);
    z-index: 1;
    transform: translate(-50%, -50%) scale(0.98);
    }

    .carousel-item.next {
    left: 65%;
    opacity: 0.6;
    filter: brightness(0.6);
    z-index: 1;
    transform: translate(-50%, -50%) scale(0.98);
    }

  .carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 2.5rem;
    background: black;           /* black background */
    border-radius: 50%;
    width: 45px;
    height: 45px;
    border: none;
    cursor: pointer;
    color: silver;               /* silver arrow color */
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    z-index: 5;
    line-height: 1;              /* remove extra line height */
    }

  .carousel-arrow.left {
    left: -60px;
  }

  .carousel-arrow.right {
    right: -60px;
  }

  .carousel-text {
    text-align: center;
    margin-top: 1rem;
  }

  .carousel-text ul {
    list-style: none;
    padding: 0;
    margin-top: 0.5rem;
  }

  @media (max-width: 768px) {
    .carousel {
      max-width: 100%;
      height: 200px;
    }

    .carousel-item.active {
      width: 200px;
      height: 160px;
    }

    .carousel-item.prev {
      left: 25%;
      width: 120px;
      height: 100px;
    }

    .carousel-item.next {
      left: 75%;
      width: 120px;
      height: 100px;
    }

    .carousel-arrow.left {
      left: -40px;
    }

    .carousel-arrow.right {
      right: -40px;
    }
  }
</style>
</head>
<body>

<section id="sponsors" class="section">
  <div class="container">
    <h2 class="section-heading" style="text-align: center; margin-bottom: 1rem;">
      We deeply appreciate our sponsors who make this journey possible.
    </h2>

    <div class="carousel">
      <button class="carousel-arrow left" aria-label="Previous">&#10094;</button>

      <div class="carousel-track">
        <!-- Images inserted dynamically here -->
      </div>

      <button class="carousel-arrow right" aria-label="Next">&#10095;</button>
    </div>

    <div class="carousel-text">
      <h3 id="sponsor-name" style="align-self: centre"></h3>
      <p id="sponsor-info"></p>
      <ul id="sponsor-stats"></ul>
    </div>

    <p style="text-align: center; margin-top: 2rem;">
      Interested in joining us? See our <a href="#become-a-sponsor">Become a Sponsor</a> section below.
    </p>
  </div>
</section>

<script>
  const sponsors = [
    {
      name: "Sponsor A",
      image: "graphics/sponsors/tacons.png",
      description: "Supporting us since 2020, Sponsor A helps us innovate with confidence.",
      stats: ["Level: Platinum", "Sponsoring for 3 years"]
    },
    {
      name: "Sponsor B",
      image: "graphics/sponsors/ssaf.png",
      description: "Sponsor B powers our technical advancements with generous support.",
      stats: ["Level: Gold", "Sponsoring for 2 years"]
    },
    {
      name: "Sponsor C",
      image: "graphics/sponsors/chris-edmundson-ltd.png",
      description: "Thanks to Sponsor C, we can keep pushing the limits on design.",
      stats: ["Level: Silver", "Sponsoring for 1 year"]
    },
    {
      name: "Sponsor D",
      image: "graphics/sponsors/nngs.png",
      description: "Sponsor D’s commitment fuels our passion for STEM education.",
      stats: ["Level: Bronze", "Sponsoring since this year"]
    }
  ];

  let currentIndex = 0;

  const track = document.querySelector('.carousel-track');
  const nameEl = document.getElementById('sponsor-name');
  const descEl = document.getElementById('sponsor-info');
  const statsEl = document.getElementById('sponsor-stats');
  const leftArrow = document.querySelector('.carousel-arrow.left');
  const rightArrow = document.querySelector('.carousel-arrow.right');

  function renderCarousel() {
    track.innerHTML = '';

    sponsors.forEach((sponsor, i) => {
      const div = document.createElement('div');
      div.classList.add('carousel-item');

      // Calculate relative index from current
      const relativeIndex = (i - currentIndex + sponsors.length) % sponsors.length;

      if (relativeIndex === 0) div.classList.add('active');
      else if (relativeIndex === sponsors.length - 1) div.classList.add('prev');
      else if (relativeIndex === 1) div.classList.add('next');

      const img = document.createElement('img');
      img.src = sponsor.image;
      img.alt = sponsor.name;

      div.appendChild(img);

      // Clicking center image moves to next sponsor
      if (relativeIndex === 0) {
        div.addEventListener('click', nextSponsor);
      }

      track.appendChild(div);
    });

    // Update text below carousel
    const currentSponsor = sponsors[currentIndex];
    nameEl.textContent = currentSponsor.name;
    descEl.textContent = currentSponsor.description;

    statsEl.innerHTML = '';
    currentSponsor.stats.forEach(stat => {
      const li = document.createElement('li');
      li.textContent = stat;
      statsEl.appendChild(li);
    });
  }

  function prevSponsor() {
    currentIndex = (currentIndex - 1 + sponsors.length) % sponsors.length;
    renderCarousel();
  }

  function nextSponsor() {
    currentIndex = (currentIndex + 1) % sponsors.length;
    renderCarousel();
  }

  leftArrow.addEventListener('click', prevSponsor);
  rightArrow.addEventListener('click', nextSponsor);

  renderCarousel();
</script>

</body>
</html>
